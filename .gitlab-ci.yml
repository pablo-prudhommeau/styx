image: docker:29

variables:
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

services:
  - docker:29-dind

stages:
  - test
  - deploy

# Test du runner 19.2.6 + dind (branche de test uniquement) : aucun login, aucun push.
test-dind:
  stage: test
  rules:
    - if: $CI_COMMIT_BRANCH == "fuego/test-dind-runner-19"
  script:
    - docker info
    - docker version
    - docker build -t styx-test-dind:$CI_COMMIT_SHORT_SHA .

deploy-docker:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - docker login -u $DOCKER_REPOSITORY_USERNAME -p $DOCKER_REPOSITORY_PASSWORD docker.nexus.nash.p1xel.fr
    - docker build -t docker.nexus.nash.p1xel.fr/styx .
    - docker push docker.nexus.nash.p1xel.fr/styx
